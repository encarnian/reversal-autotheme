<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="shadow" x="-.05" y="-.05" width="1.1" height="1.1" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2e39" offset="0%"/>
      <stop stop-color="#181a20" offset="100%"/>
    </linearGradient>
    <linearGradient id="magicGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d2ff" offset="0%"/>
      <stop stop-color="#3a7bd5" offset="50%"/>
      <stop stop-color="#9b51e0" offset="100%"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe259" offset="0%"/>
      <stop stop-color="#ffa751" offset="100%"/>
    </linearGradient>
  </defs>

  <!-- macOS Drop Shadow -->
  <rect x="4.5" y="5.5" width="55" height="55" rx="15" ry="15" fill="#000000" opacity="0.35" filter="url(#shadow)"/>

  <!-- Squircle Base Plate -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15" ry="15" fill="url(#bgGrad)" stroke="#3a3f4d" stroke-width="0.5"/>

  <!-- Magic Theme Wand & Palette Shapes -->
  <g transform="translate(0, 0)">
    <!-- Rounded Theme Card Preview Accent -->
    <rect x="14" y="14" width="22" height="22" rx="6" fill="url(#magicGrad)" opacity="0.9"/>
    <rect x="28" y="28" width="22" height="22" rx="6" fill="#2d3748" stroke="#4a5568" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Palette Color Dots -->
    <circle cx="35" cy="35" r="2.5" fill="#00d2ff"/>
    <circle cx="43" cy="35" r="2.5" fill="#ff5e62"/>
    <circle cx="35" cy="43" r="2.5" fill="#a8ff78"/>
    <circle cx="43" cy="43" r="2.5" fill="#ffe259"/>

    <!-- Wand / Sparkle -->
    <path d="M25 19 L27 23 L31 25 L27 27 L25 31 L23 27 L19 25 L23 23 Z" fill="url(#starGrad)"/>
  </g>
</svg>
